name: Build
on:
    pull_request:
        types: [opened, synchronize]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # main
              with:
                  egress-policy: audit
            - name: 准备 Socket Firewall
              uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # main
              with:
                  mode: firewall
            - name: 签出
              uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # main
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: 准备 node.js
              uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # main
              with:
                  node-version: 24
                  check-latest: true
            - name: 准备 pnpm
              uses: step-security/action-setup@7734f5522f614a4cf2820ad19aa26717c7abfd96 # main
              with:
                  version: latest
                  cache: true
            - name: 安装 pnpm 依赖
              run: sfw pnpm install
            - name: 构建
              run: |
                  node --run build
            - name: 提交
              uses: step-security/ghcommit-action@4f593fe8d019aa27a8c310bc6ee2ffec8d7e53f4 #main
              with:
                  commit_message: "pnpm"
                  repo: ${{ github.repository }}
                  branch: ${{ github.head_ref || github.ref_name }}
              env:
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
